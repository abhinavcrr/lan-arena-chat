<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAN Arena Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d1a;--panel:#111733;--panel2:#171f45;--line:#27336b;--text:#e8ecff;--muted:#8791c4;
--cyan:#00e5ff;--pink:#ff2e88;--lime:#b6ff3b;
--cut:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
--hex:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Chakra Petch","Segoe UI",system-ui,sans-serif;color:var(--text);
background:var(--bg) repeating-linear-gradient(0deg,transparent 0 39px,#ffffff08 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#ffffff08 39px 40px)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hex{clip-path:var(--hex);display:grid;place-items:center;font-weight:700;color:#06091a;flex:none}

#login{height:100%;display:grid;place-items:center;padding:24px}
#login form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);clip-path:var(--cut);padding:32px 26px;text-align:center}
#login .hex{width:76px;height:76px;margin:0 auto 16px;background:linear-gradient(135deg,var(--cyan),var(--pink));font-size:24px}
#login h1{font-size:28px;letter-spacing:.04em;margin-bottom:8px}
#login p{color:var(--muted);font-size:14px;margin-bottom:22px;line-height:1.5}
#login input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--line);margin-bottom:14px;clip-path:var(--cut)}
.btn{border:1px solid var(--cyan);background:transparent;color:var(--cyan);padding:7px 14px;cursor:pointer;font-weight:500;font-size:13px;clip-path:var(--cut)}
.btn:hover{background:var(--cyan);color:#06091a}
.btn.go{background:var(--cyan);color:#06091a}
.btn.go:hover{background:#7df3ff}
.btn.no{border-color:var(--pink);color:var(--pink)}
.btn.no:hover{background:var(--pink);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--muted)}
#login .btn{width:100%;padding:12px;font-size:16px}

#app{display:none;height:100%;grid-template-columns:340px 1fr;gap:12px;padding:12px}
aside,main{background:var(--panel);border:1px solid var(--line);clip-path:var(--cut);display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
aside h2{padding:16px 16px 2px;font-size:20px;letter-spacing:.04em}
#count{padding:0 16px 10px;color:var(--lime);font-size:13px}
#users{overflow:auto;padding:4px 10px 10px;display:flex;flex-direction:column;gap:6px}
.user{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel2);border:1px solid transparent;clip-path:var(--cut);flex-wrap:wrap}
.user.sel{border-color:var(--cyan)}
.user .hex{width:42px;height:42px}
.user .info{flex:1;min-width:90px}
.user b{display:block;font-weight:500}
.user small{font-size:12px;color:var(--muted)}
.user small.c{color:var(--lime)} .user small.i{color:var(--pink)}
.user .acts{display:flex;gap:6px}
.badge{background:var(--pink);color:#fff;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.empty{color:var(--muted);padding:20px 10px;font-size:14px;line-height:1.5}

header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
header .hex{width:40px;height:40px}
header div.t{flex:1;min-width:0}
header b{display:block}
header small{color:var(--lime);font-size:12px}
#back{display:none;background:none;border:0;font-size:24px;cursor:pointer;color:var(--cyan)}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:75%;padding:8px 13px;line-height:1.4;word-break:break-word;white-space:pre-wrap;border:1px solid var(--line);background:var(--panel2);clip-path:polygon(0 0,100% 0,100% 100%,8px 100%,0 calc(100% - 8px))}
.m.me{align-self:flex-end;background:#00e5ff1f;border-color:var(--cyan);clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.m time{display:block;font-size:11px;color:var(--muted);margin-top:2px}
#typing{height:22px;padding:0 18px;font-size:12px;color:var(--pink)}
#chips{display:flex;gap:6px;padding:0 16px 8px;flex-wrap:wrap}
#chips button{background:var(--panel2);border:1px solid var(--line);padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
#chips button:hover{border-color:var(--cyan);color:var(--cyan)}
#composer{display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
#msg{flex:1;padding:11px 14px;background:var(--bg);border:1px solid var(--line);clip-path:var(--cut)}
#lock{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:10px;z-index:2}
#lock .hex{width:84px;height:84px;background:var(--panel2);border:0;color:var(--pink);font-size:30px}
#lock h3{font-size:22px}
#lock p{color:var(--muted);max-width:320px;line-height:1.5;font-size:14px}
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--cyan);padding:10px 18px;font-size:14px;z-index:9;display:none;max-width:90vw}

@media (max-width:760px){
 #app{grid-template-columns:1fr;padding:8px}
 aside{display:none}
 #app.list aside{display:flex}
 #app.list main{display:none}
 #back{display:block}
 .m{max-width:88%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<section id="login">
  <form id="loginForm">
    <div class="hex">LA</div>
    <h1>LAN Arena</h1>
    <p>Pick a gamer tag, send a connect request, and chat once the other player accepts.</p>
    <input id="name" placeholder="Gamer tag" maxlength="16" autocomplete="off" required>
    <button class="btn go" type="submit">Enter lobby</button>
  </form>
</section>

<div id="toast" role="status"></div>
<div id="app" class="list">
  <aside>
    <h2>Lobby</h2>
    <div id="count">0 online</div>
    <div id="users"></div>
  </aside>
  <main>
    <header>
      <button id="back" aria-label="Back to lobby">‹</button>
      <div class="hex" id="hAv" style="background:var(--line)">?</div>
      <div class="t"><b id="hName">No active chat</b><small id="hSub"></small></div>
      <button class="btn no" id="leave" style="display:none">Disconnect</button>
    </header>
    <div id="msgs" aria-live="polite"></div>
    <div id="typing"></div>
    <div id="chips"><button>GG</button><button>GL HF</button><button>Ready?</button><button>BRB</button><button>Lobby up</button></div>
    <form id="composer">
      <input id="msg" placeholder="Type a message" autocomplete="off" maxlength="1000" disabled>
      <button class="btn go" id="send" type="submit">Send</button>
    </form>
    <div id="lock">
      <div class="hex">&#128274;</div>
      <h3 id="lockT"></h3>
      <p id="lockP"></p>
    </div>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const socket = io();
let me = null, users = [], rel = { connected: [], outgoing: [], incoming: [] };
let active = null, msgs = {}, unread = {}, typing = {}, tt, toastT;

const colors = ['#00e5ff','#ff2e88','#b6ff3b','#ffb020','#9d7bff','#3df5a5'];
const colorOf = (n) => colors[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % colors.length];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nameOf = (id) => (users.find((u) => u.id === id) || { name: 'Player' }).name;
const hex = (n, size) => `<div class="hex" style="width:${size}px;height:${size}px;background:${colorOf(n)}">${esc(n[0].toUpperCase())}</div>`;
const fmt = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

function toast(t) {
  const el = $('toast'); el.textContent = t; el.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => (el.style.display = 'none'), 2800);
}

try { $('name').value = localStorage.getItem('arena-tag') || ''; } catch (e) {}
$('loginForm').onsubmit = (e) => { e.preventDefault(); socket.emit('join', $('name').value); };
socket.on('joined', (u) => {
  me = u;
  try { localStorage.setItem('arena-tag', u.name); } catch (e) {}
  $('login').style.display = 'none';
  $('app').style.display = 'grid';
  render();
});
socket.on('toast', toast);
socket.on('users', (l) => { users = l; if (me) render(); });
socket.on('relations', (r) => {
  const prev = rel.connected; rel = r;
  prev.filter((x) => !r.connected.includes(x)).forEach((x) => { delete msgs[x]; delete unread[x]; });
  if (active && !r.connected.includes(active)) active = null;
  if (!active) {
    const fresh = r.connected.find((x) => !prev.includes(x));
    if (fresh) { active = fresh; $('app').classList.remove('list'); }
  }
  render();
});
socket.on('message', (m) => {
  const peer = m.from === me.id ? m.to : m.from;
  (msgs[peer] = msgs[peer] || []).push(m);
  if (peer !== active) unread[peer] = (unread[peer] || 0) + 1;
  render();
});
socket.on('typing', ({ from, isTyping }) => { typing[from] = isTyping; renderTyping(); });

function renderUsers() {
  const others = users.filter((u) => u.id !== me.id);
  $('count').textContent = `${others.length} online`;
  $('users').innerHTML = others.length ? others.map((u) => {
    const c = rel.connected.includes(u.id), i = rel.incoming.includes(u.id), o = rel.outgoing.includes(u.id);
    let st, cls = '', act;
    if (c) { st = 'Connected'; cls = 'c'; act = '<button class="btn go" data-act="open">Chat</button>'; }
    else if (i) { st = 'Wants to connect'; cls = 'i'; act = '<button class="btn go" data-act="accept">Accept</button><button class="btn no" data-act="decline">Decline</button>'; }
    else if (o) { st = 'Request sent'; act = '<button class="btn ghost" data-act="cancel">Cancel</button>'; }
    else { st = 'Not connected'; act = '<button class="btn" data-act="connect">Connect</button>'; }
    return `<div class="user ${active === u.id ? 'sel' : ''}" data-id="${esc(u.id)}">${hex(u.name, 42)}
      <div class="info"><b>${esc(u.name)}</b><small class="${cls}">${st}</small></div>
      ${unread[u.id] ? `<span class="badge">${unread[u.id]}</span>` : ''}
      <div class="acts">${act}</div></div>`;
  }).join('') : '<div class="empty">No other players yet. Open this page on another device on your network.</div>';
}

function renderChat() {
  const ok = active && rel.connected.includes(active);
  const others = users.filter((u) => u.id !== me.id);
  $('lock').style.display = ok ? 'none' : 'flex';
  $('lockT').textContent = others.length ? 'Chat locked' : 'Waiting for players';
  $('lockP').textContent = others.length
    ? 'Send a connect request from the lobby. You can chat once the other player accepts.'
    : 'Share this page\'s network link so a friend can join the lobby.';
  $('msg').disabled = !ok;
  $('leave').style.display = ok ? '' : 'none';
  if (ok) {
    const n = nameOf(active);
    $('hAv').outerHTML = `<div class="hex" id="hAv" style="width:40px;height:40px;background:${colorOf(n)}">${esc(n[0].toUpperCase())}</div>`;
    $('hName').textContent = n; $('hSub').textContent = 'Connected';
    $('msgs').innerHTML = (msgs[active] || []).map((m) =>
      `<div class="m ${m.from === me.id ? 'me' : ''}">${esc(m.text)}<time>${fmt(m.time)}</time></div>`).join('');
    $('msgs').scrollTop = $('msgs').scrollHeight;
  } else {
    $('hName').textContent = 'No active chat'; $('hSub').textContent = ''; $('msgs').innerHTML = '';
  }
  renderTyping();
}
function renderTyping() {
  $('typing').textContent = active && typing[active] ? `${nameOf(active)} is typing…` : '';
}
function render() { renderUsers(); renderChat(); }

$('users').onclick = (e) => {
  const row = e.target.closest('.user'); if (!row) return;
  const id = row.dataset.id, b = e.target.closest('[data-act]');
  const act = b ? b.dataset.act : (rel.connected.includes(id) ? 'open' : null);
  if (act === 'connect') socket.emit('request', id);
  else if (act === 'accept') socket.emit('respond', { from: id, accept: true });
  else if (act === 'decline') socket.emit('respond', { from: id, accept: false });
  else if (act === 'cancel') socket.emit('cancel', id);
  else if (act === 'open') { active = id; unread[id] = 0; $('app').classList.remove('list'); render(); }
};
function send(text) {
  text = text.trim();
  if (!text || !active) return;
  socket.emit('message', { to: active, text });
  socket.emit('typing', { to: active, isTyping: false });
}
$('composer').onsubmit = (e) => { e.preventDefault(); send($('msg').value); $('msg').value = ''; };
$('msg').oninput = () => {
  if (!active) return;
  socket.emit('typing', { to: active, isTyping: true });
  clearTimeout(tt); tt = setTimeout(() => socket.emit('typing', { to: active, isTyping: false }), 1200);
};
$('chips').onclick = (e) => { if (e.target.tagName === 'BUTTON' && !$('msg').disabled) send(e.target.textContent); };
$('leave').onclick = () => { if (active) socket.emit('unlink', { to: active }); };
$('back').onclick = () => $('app').classList.add('list');
</script>
</body>
</html>
